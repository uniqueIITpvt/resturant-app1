tags:
  - name: Upload
    description: File upload operations

paths:
  /api/upload/image:
    post:
      summary: Upload an image
      tags: [Upload]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to upload
      responses:
        200:
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  imageData:
                    type: object
                    properties:
                      public_id:
                        type: string
                        description: Public ID of the uploaded image
                      url:
                        type: string
                        description: URL of the uploaded image
        400:
          description: Invalid input or file type
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        413:
          description: File too large
        500:
          description: Server error

  /api/upload/image/{public_id}:
    delete:
      summary: Delete an image
      tags: [Upload]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: public_id
          required: true
          schema:
            type: string
          description: Public ID of the image to delete
      responses:
        200:
          description: Image deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Image not found
        500:
          description: Server error
