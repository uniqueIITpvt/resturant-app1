tags:
  - name: Products
    description: Product management

paths:
  /api/products:
    get:
      summary: Get all products
      tags: [Products]
      responses:
        200:
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        500:
          description: Server error

    post:
      summary: Create a new product
      tags: [Products]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - price
                - category
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category:
                  type: string
                image:
                  type: object
                  properties:
                    public_id:
                      type: string
                    url:
                      type: string
                addonGroups:
                  type: array
                  items:
                    $ref: '#/components/schemas/AddonGroup'
      responses:
        201:
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        500:
          description: Server error

  /api/products/category/{category}:
    get:
      summary: Get products by category
      tags: [Products]
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
          description: Category name
      responses:
        200:
          description: List of products in the specified category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        404:
          description: No products found in this category
        500:
          description: Server error

  /api/products/{id}:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        200:
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        404:
          description: Product not found
        500:
          description: Server error

    put:
      summary: Update a product
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category:
                  type: string
                image:
                  type: object
                  properties:
                    public_id:
                      type: string
                    url:
                      type: string
                addonGroups:
                  type: array
                  items:
                    $ref: '#/components/schemas/AddonGroup'
      responses:
        200:
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Product not found
        500:
          description: Server error

    delete:
      summary: Delete a product
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        200:
          description: Product deleted successfully
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Product not found
        500:
          description: Server error
