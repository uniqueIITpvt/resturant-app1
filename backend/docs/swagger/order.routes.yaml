tags:
  - name: Orders
    description: Order management

paths:
  /api/orders:
    get:
      summary: Get all orders
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of all orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        500:
          description: Server error

    post:
      summary: Create a new order
      tags: [Orders]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - subtotal
                - tax
                - deliveryFee
                - total
                - deliveryAddress
                - paymentMethod
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - name
                      - price
                      - quantity
                    properties:
                      id:
                        type: string
                        description: Product ID
                      name:
                        type: string
                        description: Product name
                      price:
                        type: number
                        description: Product price
                      quantity:
                        type: number
                        description: Quantity ordered
                      image:
                        type: string
                        description: Product image URL
                      selectedAddons:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  price:
                                    type: number
                subtotal:
                  type: number
                  description: Order subtotal before tax and fees
                tax:
                  type: number
                  description: Tax amount
                deliveryFee:
                  type: number
                  description: Delivery fee
                coupon:
                  type: object
                  properties:
                    code:
                      type: string
                    discountType:
                      type: string
                      enum: [percentage, fixed]
                    discountValue:
                      type: number
                    discountAmount:
                      type: number
                total:
                  type: number
                  description: Total order amount
                deliveryAddress:
                  type: object
                  properties:
                    addressType:
                      type: string
                      enum: [home, work, other]
                    name:
                      type: string
                    phoneNumber:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                    additionalDirections:
                      type: string
                    landmark:
                      type: string
                paymentMethod:
                  type: string
                  enum: [cash, card]
                  description: Payment method
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        500:
          description: Server error

  /api/orders/user:
    get:
      summary: Get current user orders
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        401:
          description: Unauthorized - missing or invalid token
        500:
          description: Server error

  /api/orders/{id}:
    get:
      summary: Get order by ID
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        200:
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - not authorized to view this order
        404:
          description: Order not found
        500:
          description: Server error

  /api/orders/{id}/status:
    patch:
      summary: Update order status
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, processing, completed, cancelled]
                  description: New order status
      responses:
        200:
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid status
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Order not found
        500:
          description: Server error

  /api/orders/{id}/cancel:
    put:
      summary: Cancel order
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        200:
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Order cannot be cancelled
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - not authorized to cancel this order
        404:
          description: Order not found
        500:
          description: Server error
