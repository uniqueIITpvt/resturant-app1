openapi: 3.0.0
info:
  title: Restaurant Business API
  version: 1.0.0
  description: API documentation for Restaurant Business Backend
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://resturant-bussiness-api.vercel.app
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - name
        - email
        - password
      properties:
        _id:
          type: string
          description: The auto-generated id of the user
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password (hashed, never returned in responses)
        role:
          type: string
          enum: [user, admin, superadmin]
          description: User's role in the system
        isVerified:
          type: boolean
          description: Whether the user's email is verified
        createdAt:
          type: string
          format: date-time
          description: When the user was created
        updatedAt:
          type: string
          format: date-time
          description: When the user was last updated

    AddonOption:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          description: Name of the addon option
        price:
          type: number
          description: Price of the addon option

    AddonGroup:
      type: object
      required:
        - title
        - options
      properties:
        title:
          type: string
          description: Title of the addon group
        required:
          type: boolean
          description: Whether the addon group is required
          default: false
        options:
          type: array
          items:
            $ref: '#/components/schemas/AddonOption'

    Product:
      type: object
      required:
        - name
        - description
        - price
        - category
      properties:
        _id:
          type: string
          description: The auto-generated id of the product
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          description: Product base price
        category:
          type: string
          description: Product category
        image:
          type: object
          properties:
            public_id:
              type: string
            url:
              type: string
        addonGroups:
          type: array
          items:
            $ref: '#/components/schemas/AddonGroup'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Coupon:
      type: object
      required:
        - code
        - description
        - discountType
        - discountValue
        - endDate
      properties:
        _id:
          type: string
          description: The auto-generated id of the coupon
        code:
          type: string
          description: Unique coupon code
        description:
          type: string
          description: Coupon description
        discountType:
          type: string
          enum: [percentage, fixed]
          description: Type of discount
        discountValue:
          type: number
          description: Amount of discount
        minOrderValue:
          type: number
          description: Minimum order value required to apply the coupon
        maxDiscountAmount:
          type: number
          description: Maximum discount amount applicable
        startDate:
          type: string
          format: date-time
          description: When the coupon becomes active
        endDate:
          type: string
          format: date-time
          description: When the coupon expires
        isActive:
          type: boolean
          description: Whether the coupon is active
        usageLimit:
          type: number
          description: Maximum number of times the coupon can be used
        usedCount:
          type: number
          description: Number of times the coupon has been used
        userLimit:
          type: number
          description: Maximum number of times a user can use this coupon
        applicableProducts:
          type: array
          items:
            type: string
          description: List of product IDs this coupon applies to
        applicableCategories:
          type: array
          items:
            type: string
          description: List of category IDs this coupon applies to
        excludedProducts:
          type: array
          items:
            type: string
          description: List of product IDs this coupon does not apply to
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
          description: The auto-generated id of the category
        name:
          type: string
          description: Category name
        description:
          type: string
          description: Category description
        image:
          type: object
          properties:
            public_id:
              type: string
            url:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        _id:
          type: string
          description: The auto-generated id of the order
        user:
          type: string
          description: User ID who placed the order
        orderNumber:
          type: string
          description: Unique order number
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Product ID
              name:
                type: string
                description: Product name
              price:
                type: number
                description: Product price
              quantity:
                type: number
                description: Quantity ordered
              image:
                type: string
                description: Product image URL
              selectedAddons:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          price:
                            type: number
        subtotal:
          type: number
          description: Order subtotal before tax and fees
        tax:
          type: number
          description: Tax amount
        deliveryFee:
          type: number
          description: Delivery fee
        coupon:
          type: object
          properties:
            code:
              type: string
            discountType:
              type: string
              enum: [percentage, fixed]
            discountValue:
              type: number
            discountAmount:
              type: number
        total:
          type: number
          description: Total order amount
        status:
          type: string
          enum: [pending, processing, completed, cancelled]
          description: Current order status
        cancelledBy:
          type: string
          enum: [user, admin, null]
          description: Who cancelled the order (if applicable)
        cancelledAt:
          type: string
          format: date-time
          description: When the order was cancelled
        deliveryAddress:
          type: object
          properties:
            addressType:
              type: string
              enum: [home, work, other]
            name:
              type: string
            phoneNumber:
              type: string
            street:
              type: string
            city:
              type: string
            state:
              type: string
            postalCode:
              type: string
            country:
              type: string
            additionalDirections:
              type: string
            landmark:
              type: string
        paymentMethod:
          type: string
          enum: [cash, card]
          description: Payment method
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      required:
        - addressType
        - name
        - phoneNumber
        - street
        - city
        - state
        - postalCode
        - country
      properties:
        _id:
          type: string
          description: The auto-generated id of the address
        addressType:
          type: string
          enum: [home, work, other]
          description: Type of address
        name:
          type: string
          description: Recipient name
        phoneNumber:
          type: string
          description: Contact phone number
        street:
          type: string
          description: Street address
        city:
          type: string
          description: City
        state:
          type: string
          description: State or province
        postalCode:
          type: string
          description: Postal or ZIP code
        country:
          type: string
          description: Country
        additionalDirections:
          type: string
          description: Additional delivery directions
        landmark:
          type: string
          description: Nearby landmark
        isDefault:
          type: boolean
          description: Whether this is the default address

    EventOffer:
      type: object
      required:
        - title
        - description
        - type
        - startDate
        - endDate
      properties:
        _id:
          type: string
          description: The auto-generated id of the event offer
        title:
          type: string
          description: Title of the event/offer
        description:
          type: string
          description: Detailed description of the event/offer
        type:
          type: string
          enum: [holiday, seasonal, promotion, special]
          description: Type of event/offer
        startDate:
          type: string
          format: date-time
          description: When the event/offer starts
        endDate:
          type: string
          format: date-time
          description: When the event/offer ends
        image:
          type: object
          properties:
            public_id:
              type: string
            url:
              type: string
        discount:
          type: object
          properties:
            type:
              type: string
              enum: [percentage, fixed]
            value:
              type: number
            code:
              type: string
              description: Related coupon code
        isActive:
          type: boolean
          description: Whether the event/offer is currently active
        targetAudience:
          type: string
          enum: [all, new, existing, vip]
          description: Target user segment for this event/offer
        metrics:
          type: object
          properties:
            views:
              type: number
              description: Number of times the offer was viewed
            clicks:
              type: number
              description: Number of times the offer was clicked
            conversions:
              type: number
              description: Number of times the offer was used
            conversionRate:
              type: number
              description: Percentage of clicks that resulted in conversions
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Products
    description: Product management
  - name: Orders
    description: Order management
  - name: Categories
    description: Category management
  - name: Coupons
    description: Coupon management
  - name: Users
    description: User management operations
  - name: Upload
    description: File upload operations
  - name: Email
    description: Email sending operations
  - name: EventOffers
    description: Event and offer management

paths:
  /:
    get:
      summary: Root endpoint
      description: Returns basic API information
      responses:
        200:
          description: Success response with API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  endpoints:
                    type: object
                  status:
                    type: string

  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        201:
          description: User registered successfully
        400:
          description: Invalid input or email already exists

  /api/auth/admin-register:
    post:
      summary: Register an admin user
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [admin, superadmin]
      responses:
        201:
          description: Admin user registered successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - requires superadmin privileges

  /api/auth/verify-otp:
    post:
      summary: Verify OTP code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        200:
          description: OTP verified successfully
        400:
          description: Invalid OTP or email

  /api/auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
        401:
          description: Invalid credentials or account not verified

  /api/auth/resend-otp:
    post:
      summary: Resend OTP code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: OTP sent successfully
        400:
          description: User not found or invalid email

  /api/auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Password reset token sent successfully
        404:
          description: User not found

  /api/auth/verify-reset-token:
    post:
      summary: Verify password reset token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
      responses:
        200:
          description: Token is valid
        400:
          description: Invalid token or email

  /api/auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        200:
          description: Password reset successful
        400:
          description: Invalid token, email, or password

  /api/auth/me:
    get:
      summary: Get current user profile
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
        401:
          description: Unauthorized - invalid or missing token

  /api/products:
    get:
      summary: Get all products
      tags: [Products]
      responses:
        200:
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        500:
          description: Server error

    post:
      summary: Create a new product
      tags: [Products]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - price
                - category
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category:
                  type: string
                image:
                  type: object
                  properties:
                    public_id:
                      type: string
                    url:
                      type: string
                addonGroups:
                  type: array
                  items:
                    $ref: '#/components/schemas/AddonGroup'
      responses:
        201:
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        500:
          description: Server error

  /api/products/category/{category}:
    get:
      summary: Get products by category
      tags: [Products]
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
          description: Category name
      responses:
        200:
          description: List of products in the specified category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        404:
          description: No products found in this category
        500:
          description: Server error

  /api/products/{id}:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        200:
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        404:
          description: Product not found
        500:
          description: Server error

    put:
      summary: Update a product
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                category:
                  type: string
                image:
                  type: object
                  properties:
                    public_id:
                      type: string
                    url:
                      type: string
                addonGroups:
                  type: array
                  items:
                    $ref: '#/components/schemas/AddonGroup'
      responses:
        200:
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Product not found
        500:
          description: Server error

    delete:
      summary: Delete a product
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        200:
          description: Product deleted successfully
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Product not found
        500:
          description: Server error

  /api/orders:
    get:
      summary: Get all orders
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of all orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        500:
          description: Server error

    post:
      summary: Create a new order
      tags: [Orders]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - subtotal
                - tax
                - deliveryFee
                - total
                - deliveryAddress
                - paymentMethod
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - name
                      - price
                      - quantity
                    properties:
                      id:
                        type: string
                        description: Product ID
                      name:
                        type: string
                        description: Product name
                      price:
                        type: number
                        description: Product price
                      quantity:
                        type: number
                        description: Quantity ordered
                      image:
                        type: string
                        description: Product image URL
                      selectedAddons:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  price:
                                    type: number
                subtotal:
                  type: number
                  description: Order subtotal before tax and fees
                tax:
                  type: number
                  description: Tax amount
                deliveryFee:
                  type: number
                  description: Delivery fee
                coupon:
                  type: object
                  properties:
                    code:
                      type: string
                    discountType:
                      type: string
                      enum: [percentage, fixed]
                    discountValue:
                      type: number
                    discountAmount:
                      type: number
                total:
                  type: number
                  description: Total order amount
                deliveryAddress:
                  type: object
                  properties:
                    addressType:
                      type: string
                      enum: [home, work, other]
                    name:
                      type: string
                    phoneNumber:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                    additionalDirections:
                      type: string
                    landmark:
                      type: string
                paymentMethod:
                  type: string
                  enum: [cash, card]
                  description: Payment method
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        500:
          description: Server error

  /api/orders/user:
    get:
      summary: Get current user orders
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        401:
          description: Unauthorized - missing or invalid token
        500:
          description: Server error

  /api/orders/{id}:
    get:
      summary: Get order by ID
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        200:
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - not authorized to view this order
        404:
          description: Order not found
        500:
          description: Server error

  /api/orders/{id}/status:
    patch:
      summary: Update order status
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, processing, completed, cancelled]
                  description: New order status
      responses:
        200:
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid status
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Order not found
        500:
          description: Server error

  /api/orders/{id}/cancel:
    put:
      summary: Cancel order
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        200:
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Order cannot be cancelled
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - not authorized to cancel this order
        404:
          description: Order not found
        500:
          description: Server error

  /api/categories:
    get:
      summary: Get all categories
      tags: [Categories]
      responses:
        200:
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
