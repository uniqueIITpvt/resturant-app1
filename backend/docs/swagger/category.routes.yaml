tags:
  - name: Categories
    description: Category management

paths:
  /api/categories:
    get:
      summary: Get all categories
      tags: [Categories]
      responses:
        200:
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        500:
          description: Server error

    post:
      summary: Create a new category
      tags: [Categories]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Category name
                description:
                  type: string
                  description: Category description
                image:
                  type: object
                  properties:
                    public_id:
                      type: string
                    url:
                      type: string
      responses:
        201:
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        500:
          description: Server error

  /api/categories/{id}:
    get:
      summary: Get category by ID
      tags: [Categories]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category ID
      responses:
        200:
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        404:
          description: Category not found
        500:
          description: Server error

    put:
      summary: Update a category
      tags: [Categories]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Category name
                description:
                  type: string
                  description: Category description
                image:
                  type: object
                  properties:
                    public_id:
                      type: string
                    url:
                      type: string
      responses:
        200:
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        400:
          description: Invalid input data
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Category not found
        500:
          description: Server error

    delete:
      summary: Delete a category
      tags: [Categories]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category ID
      responses:
        200:
          description: Category deleted successfully
        401:
          description: Unauthorized - missing or invalid token
        403:
          description: Forbidden - user does not have admin rights
        404:
          description: Category not found
        500:
          description: Server error
