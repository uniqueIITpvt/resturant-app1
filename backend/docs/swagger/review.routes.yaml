tags:
  - name: Reviews
    description: Customer review management
  - name: Reviews - Admin
    description: Admin review management operations

paths:
  /api/reviews/product/{productId}:
    get:
      summary: Get reviews for a specific product
      tags: [Reviews]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID to get reviews for
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of reviews per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, rating, helpful]
            default: createdAt
          description: Sort by field
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        200:
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  stats:
                    $ref: '#/components/schemas/ReviewStats'
        500:
          description: Server error

  /api/reviews/eligible-orders:
    get:
      summary: Get orders eligible for review
      tags: [Reviews]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Eligible orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibleOrder'
        401:
          description: Unauthorized
        500:
          description: Server error

  /api/reviews/my-reviews:
    get:
      summary: Get current user's reviews
      tags: [Reviews]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of reviews per page
      responses:
        200:
          description: User reviews retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        401:
          description: Unauthorized
        500:
          description: Server error

  /api/reviews:
    post:
      summary: Create a new review
      tags: [Reviews]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - orderId
                - productId
                - rating
                - comment
              properties:
                orderId:
                  type: string
                  description: Order ID
                productId:
                  type: string
                  description: Product ID
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Rating (1-5)
                comment:
                  type: string
                  description: Review comment
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Review images (optional, max 5 files)
      responses:
        201:
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        400:
          description: Bad request - validation errors
        401:
          description: Unauthorized
        404:
          description: Order or product not found
        500:
          description: Server error

  /api/reviews/{reviewId}:
    put:
      summary: Update a review
      tags: [Reviews]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Rating (1-5)
                comment:
                  type: string
                  description: Review comment
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Review images (optional, replaces existing)
      responses:
        200:
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        400:
          description: Bad request - validation errors
        401:
          description: Unauthorized
        404:
          description: Review not found
        500:
          description: Server error

    delete:
      summary: Delete a review
      tags: [Reviews]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      responses:
        200:
          description: Review deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Review deleted successfully
        401:
          description: Unauthorized
        404:
          description: Review not found
        500:
          description: Server error

  /api/reviews/{reviewId}/helpful:
    post:
      summary: Toggle helpful vote for a review
      tags: [Reviews]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [add, remove]
                  description: Action to perform
      responses:
        200:
          description: Vote updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Vote updated successfully
                  helpfulVotes:
                    type: integer
                    description: Updated helpful votes count
        401:
          description: Unauthorized
        404:
          description: Review not found
        500:
          description: Server error

  /api/reviews/admin/all:
    get:
      summary: Get all reviews (Admin only)
      tags: [Reviews - Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Number of reviews per page
        - in: query
          name: rating
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Filter by rating
        - in: query
          name: isHidden
          schema:
            type: boolean
          description: Filter by hidden status
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, rating, helpful]
            default: createdAt
          description: Sort by field
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        200:
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminReview'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        401:
          description: Unauthorized
        403:
          description: Forbidden - admin access required
        500:
          description: Server error

  /api/reviews/admin/stats:
    get:
      summary: Get review statistics (Admin only)
      tags: [Reviews - Admin]
      security:
        - BearerAuth: []
      responses:
        200:
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalReviews:
                    type: integer
                    description: Total number of reviews
                  averageRating:
                    type: number
                    description: Average rating across all reviews
                  ratingDistribution:
                    type: object
                    properties:
                      '1':
                        type: integer
                      '2':
                        type: integer
                      '3':
                        type: integer
                      '4':
                        type: integer
                      '5':
                        type: integer
                  recentReviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                    description: Last 5 reviews
        401:
          description: Unauthorized
        403:
          description: Forbidden - admin access required
        500:
          description: Server error

  /api/reviews/admin/{reviewId}/respond:
    post:
      summary: Respond to a review (Admin only)
      tags: [Reviews - Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Admin response message
                  example: Thank you for your feedback! We're glad you enjoyed our product.
      responses:
        200:
          description: Response added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Response added successfully
                  review:
                    $ref: '#/components/schemas/Review'
        400:
          description: Bad request - message is required
        401:
          description: Unauthorized
        403:
          description: Forbidden - admin access required
        404:
          description: Review not found
        500:
          description: Server error

  /api/reviews/admin/{reviewId}/visibility:
    patch:
      summary: Toggle review visibility (Admin only)
      tags: [Reviews - Admin]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isHidden
              properties:
                isHidden:
                  type: boolean
                  description: Whether to hide the review
                  example: true
      responses:
        200:
          description: Visibility updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Review hidden successfully
                  review:
                    $ref: '#/components/schemas/Review'
        401:
          description: Unauthorized
        403:
          description: Forbidden - admin access required
        404:
          description: Review not found
        500:
          description: Server error

components:
  schemas:
    Review:
      type: object
      properties:
        _id:
          type: string
          description: Review ID
        user:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
        order:
          type: string
          description: Order ID reference
        product:
          type: object
          properties:
            id:
              type: string
              description: Product ID
            name:
              type: string
              description: Product name
            image:
              type: string
              description: Product image URL
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating (1-5 stars)
        comment:
          type: string
          description: Review comment
        images:
          type: array
          items:
            type: object
            properties:
              public_id:
                type: string
              url:
                type: string
          description: Review images
        isVerified:
          type: boolean
          description: Whether the review is verified
        helpfulVotes:
          type: integer
          description: Number of helpful votes
        reportCount:
          type: integer
          description: Number of reports
        isHidden:
          type: boolean
          description: Whether the review is hidden
        adminResponse:
          type: object
          properties:
            message:
              type: string
            respondedBy:
              type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
            respondedAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            user:
              type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                email:
                  type: string
            order:
              type: object
              properties:
                _id:
                  type: string
                orderNumber:
                  type: string

    EligibleOrder:
      type: object
      properties:
        _id:
          type: string
          description: Order ID
        orderNumber:
          type: string
          description: Order number
        createdAt:
          type: string
          format: date-time
          description: Order creation date
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Product ID
              name:
                type: string
                description: Product name
              price:
                type: number
                description: Product price
              quantity:
                type: integer
                description: Quantity ordered
              image:
                type: string
                description: Product image URL

    ReviewStats:
      type: object
      properties:
        averageRating:
          type: number
          description: Average rating
        totalReviews:
          type: integer
          description: Total number of reviews
        ratingDistribution:
          type: object
          properties:
            '1':
              type: integer
            '2':
              type: integer
            '3':
              type: integer
            '4':
              type: integer
            '5':
              type: integer

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          description: Current page number
        totalPages:
          type: integer
          description: Total number of pages
        totalReviews:
          type: integer
          description: Total number of reviews
        hasNext:
          type: boolean
          description: Whether there is a next page
        hasPrev:
          type: boolean
          description: Whether there is a previous page
